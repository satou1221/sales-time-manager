<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a237e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="業務時間">
  <title>営業部 業務時間管理</title>
  <link rel="stylesheet" href="style.css?v=1.59">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="app">

<!-- ===== 初期設定画面 ===== -->
<div id="setup-screen">
  <h2>&#128203; 初期設定</h2>
  <p>アプリを使用する前に、あなたの情報を登録してください。</p>
  <div class="form-group">
    <label class="form-label">社員番号 * <span class="text-xs" style="color:#ff8a80;font-weight:normal;">※6桁の数字</span></label>
    <input type="number" id="setup-emp-id" class="form-input" placeholder="例：123456" pattern="\d{6}">
  </div>
  <div class="form-group">
    <label class="form-label">氏名 * <span class="text-xs" style="color:#ff8a80;font-weight:normal;">※姓と名の間にスペースを入れない</span></label>
    <input type="text" id="setup-name" class="form-input" placeholder="例：山田太郎">
  </div>
  <div class="form-group">
    <label class="form-label">部門 *</label>
    <select id="setup-dept" class="form-input">
      <option value="">選択してください</option>
      <option value="営業部本社">営業部本社</option>
      <option value="営業部福岡支社">営業部福岡支社</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">役職 *</label>
    <select id="setup-role" class="form-input">
      <option value="">選択してください</option>
      <option value="部長">部長</option>
      <option value="次長">次長</option>
      <option value="課長">課長</option>
      <option value="副長">副長</option>
      <option value="主任">主任</option>
      <option value="担当">担当</option>
      <option value="契約・派遣社員">契約・派遣社員</option>
    </select>
  </div>
  <button class="btn btn-primary" style="margin-top:10px;" onclick="saveSetup()">登録して開始</button>
</div>

<!-- ===== メイン画面（ホーム） ===== -->
<div id="home-screen" style="display:none">
  <header id="app-header">
    <h1>業務時間管理</h1>
    <div id="header-user"></div>
  </header>

  <div class="home-content">
    <!-- ステータスカード -->
    <div class="status-card">
      <div class="status-date" id="current-date">2026年6月1日(月)</div>
      <div class="status-main">
        <div class="status-label">現在の状態</div>
        <div class="status-value" id="current-status">未着手</div>
      </div>
      <div class="status-time-grid">
        <div class="time-item">
          <div class="time-label">開始</div>
          <div class="time-val" id="start-time-display">--:--</div>
        </div>
        <div class="time-item">
          <div class="time-label">終了</div>
          <div class="time-val" id="end-time-display">--:--</div>
        </div>
        <div class="time-item">
          <div class="time-label">休憩</div>
          <div class="time-val" id="break-time-display">0分</div>
        </div>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="action-grid">
      <button class="action-btn" id="btn-start" onclick="handleStart()">
        <span class="action-icon">&#9654;</span>業務開始
      </button>
      <button class="action-btn" id="btn-end" onclick="handleEnd()" disabled>
        <span class="action-icon">&#9632;</span>業務終了
      </button>
      <button class="action-btn" id="btn-break" onclick="handleBreak()" disabled>
        <span class="action-icon">&#9208;</span>休憩開始
      </button>
      <button class="action-btn" id="btn-resume" onclick="handleResume()" style="display:none">
        <span class="action-icon">&#9654;</span>休憩終了
      </button>
    </div>

    <!-- 業務区分入力（終了時のみ表示） -->
    <div id="work-type-section" style="display:none">
      <div class="section-title">&#128221; 業務区分別時間の入力</div>
      <p class="text-xs" style="margin-bottom:10px; opacity:0.8;">本日の業務時間の内訳を入力してください。</p>
      <div id="work-type-list"></div>
      <div class="work-total-info">
        合計：<span id="work-total-min">0</span>分 / 実働：<span id="actual-work-min">0</span>分
      </div>
      <button class="btn btn-primary" id="btn-save-work" onclick="saveWorkDetails()">内訳を保存して確定</button>
    </div>
  </div>
</div>

<!-- ===== 履歴画面 ===== -->
<div id="history-screen" style="display:none">
  <header id="app-header">
    <h1>勤務履歴</h1>
  </header>
  <div class="screen-content">
    <div id="history-list"></div>
  </div>
</div>

<!-- ===== 分析画面 ===== -->
<div id="analysis-screen" style="display:none">
  <header id="app-header">
    <h1>月間分析</h1>
  </header>
  <div class="screen-content">
    <div class="chart-container">
      <canvas id="workTypeChart"></canvas>
    </div>
    <div id="analysis-summary"></div>
  </div>
</div>

<!-- ===== 設定画面 ===== -->
<div id="settings-screen" style="display:none">
  <header id="app-header">
    <h1>設定</h1>
  </header>
  <div class="screen-content">
    <div class="settings-group">
      <div class="settings-item" onclick="editProfile()">
        <span>👤 プロフィール編集</span>
        <span>&#10095;</span>
      </div>
      <div class="settings-item" onclick="exportData()">
        <span>&#128229; データ書き出し(CSV)</span>
        <span>&#10095;</span>
      </div>
      <div class="settings-item" onclick="resetApp()">
        <span style="color:var(--accent)">&#9888; アプリのリセット</span>
        <span>&#10095;</span>
      </div>
    </div>
    <div style="text-align:center; margin-top:30px; font-size:0.7rem; opacity:0.5;">
      Version 1.59
    </div>
  </div>
</div>

<!-- ===== ナビゲーション（4タブ） ===== -->
<nav id="nav-bar">
  <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
    <span class="nav-icon">&#127968;</span>ホーム
  </button>
  <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
    <span class="nav-icon">&#128197;</span>履歴
  </button>
  <button class="nav-btn" id="nav-analysis" onclick="switchTab('analysis')">
    <span class="nav-icon">&#128202;</span>分析
  </button>
  <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">
    <span class="nav-icon">&#9881;</span>設定
  </button>
</nav>

<!-- モーダル等 -->
<div id="modal-overlay" style="display:none"></div>
<div id="day-detail-modal" class="modal" style="display:none">
  <div class="modal-content">
    <h3 id="modal-date"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeDayDetailModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- トースト通知 -->
<div id="toast"></div>

</div> <!-- /#app -->
<script src="app.js?v=1.59"></script>
</body>
</html>
